allowBuilds:
  '@clerk/shared': false
  esbuild: false
  sharp: false
  unrs-resolver: false

overrides:
  # TypeScript ESLint still requests vulnerable Minimatch 10.
  'minimatch@>=7 <11.0.1': '^11.0.1'
  # Clerk pins an affected js-cookie release.
  'js-cookie@<3.0.7': '^3.0.7'
  # Drizzle's legacy TypeScript loader requests vulnerable esbuild 0.18.
  '@esbuild-kit/core-utils>esbuild': '^0.25.12'
